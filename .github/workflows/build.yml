name: Build
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-packages:
    name: Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiga-family/actions/setup-variables@ab5a9c7e8a57e7afcea80c4f7210ce57de3c109e # v2.13.0
      - uses: taiga-family/actions/setup-node@ab5a9c7e8a57e7afcea80c4f7210ce57de3c109e # v2.13.0
      - run: npx nx run-many --target build --all --exclude=demo

  build-demo:
    name: Demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiga-family/actions/setup-variables@ab5a9c7e8a57e7afcea80c4f7210ce57de3c109e # v2.13.0
      - uses: taiga-family/actions/setup-node@ab5a9c7e8a57e7afcea80c4f7210ce57de3c109e # v2.13.0
      - run: npx nx build-gh-pages

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
